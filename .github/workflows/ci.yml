# 三件事：格式、lint、测试。仓库里已经有几百个测试，但没有一条自动门。
#
# 为什么跑在 Arch 容器里而不是 ubuntu 上：这个二进制**链接 libalpm**
# （包数据层直连 pacman 的库，见 src/packages/libalpm.rs）。ubuntu 上没有它，
# 连编译都过不去。Arch 镜像里 pacman 包自带 libalpm.so 与 libalpm.pc。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 冒烟测试要真跑 ffmpeg / 7z / jq / pandoc / exiftool / magick，还要联网问 AUR 与
  # 新闻源 —— 放进每次 PR 只会又慢又飘。所以每周跑一次，也能手动触发。
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# 同一个分支连续 push 时，旧的那次直接取消：CI 只关心最新一次的结果。
# 放在 workflow 级而不是每个 job —— 两个 job 用同一个 group 会互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # GITHUB_TOKEN 收窄到只读：不显式声明的话默认权限比这宽。
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf chafa fish
        # chafa：ratatui-image 的**可选**图像后端。当前 feature 只用 crossterm
        # （chafa 的探测在 chafa-dyn / chafa-static 里被 cfg 掉，实测 ldd 里没有
        # libchafa），所以构建其实不需要它；这里仍装上是为了和 packaging/PKGBUILD
        # 声明的运行时依赖保持一致，也免得将来打开 chafa 后端时 CI 才炸。
        # 缺了就直接构建失败（这是这个仓库第一次跑 CI 时踩到的）
        # fish：下面要拿它验生成的集成脚本能不能被解析。

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: featured Recipe 索引与安全校验
        run: python3 registry/build-featured.py --check

      - name: 格式
        run: cargo fmt --check

      - name: lint（警告即错误）
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test --all-features

      # cargo test 里已经有一条「官方 registry 必须自洽」的测试，这里再显式跑一次
      # check：报错信息更具体（哪个包、哪个文件、怎么修），而且和 Registry 工作流
      # 用同一条命令 —— 改了 registry/ 却在别的 workflow 上，也能被拦住。
      - name: 工具仓库自洽（索引 ↔ 产物 ↔ 源码）
        run: cargo run --quiet -- check registry/

      # shell 集成的两条前提，纯字符串断言测不出来：
      #   1. 生成的脚本必须能被**它自己的 shell**解析（bash -n / fish --no-execute）；
      #   2. 回填的那一行必须干净、且没填的参数要留下看得见的占位符。
      - name: shell widget 冒烟
        run: |
          set -euo pipefail
          cargo build --quiet
          bin=./target/debug/toolbox-hub

          "$bin" widget bash | bash -n
          "$bin" widget fish | fish --no-execute

          line="$("$bin" widget render git-log count=5)"
          [ "$line" = "git log --oneline -n 5" ] || {
            echo "回填的那一行不对：$line" >&2; exit 1;
          }
          line="$("$bin" widget render git-log)"
          [ "$line" = "git log --oneline -n <count>" ] || {
            echo "没填的参数应当留下占位符：$line" >&2; exit 1;
          }

          if "$bin" widget render no-such-recipe >/dev/null 2>&1; then
            echo "未知 Recipe 应当以非零退出" >&2; exit 1
          fi
          if "$bin" widget nushell >/dev/null 2>&1; then
            echo "不支持的 shell 应当以非零退出" >&2; exit 1
          fi
          echo "✓ widget 脚本可解析，渲染结果干净"

      # 发版路径上的脚本平时没人跑，语法错要等到 tag 那天才暴露 —— 这里先挡一道。
      - name: 打包/发版脚本语法
        run: |
          set -euo pipefail
          for script in packaging/update-aur.sh packaging/verify-release.sh packaging/make-source-tarball.sh; do
            bash -n "$script"
            echo "✓ $script"
          done


  # Cargo.toml 声明 `rust-version = "1.90"`，但上面的 check 用的是 Arch 的最新
  # stable —— 拦不住「不小心用了 1.91 才有的 API」这类 MSRV 回归。这一 job 固定
  # 用 1.90.0 编译一次：MSRV 破了就在这里红，而不是在用户的旧工具链上才炸。
  msrv:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（libalpm / pkgconf / chafa）
        run: pacman -Syu --noconfirm --needed base-devel git pkgconf chafa

      - name: 装 MSRV 工具链（Cargo.toml 声明的 1.90）
        uses: dtolnay/rust-toolchain@1.90.0

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 用最低支持版本编译（--locked，MSRV 回归即红）
        run: cargo build --locked

  # README 里那句「行为用测试钉住，工具链用冒烟钉住」的后半句。
  # 这批 `--ignored` 测试抓的都是只有真跑才看得见的问题（7z 只认 -mx9、
  # ImageMagick 要求输入在前、ffmpeg 漏 -i 会把输入当输出…），所以别删。
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链与冒烟要用到的 CLI
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git rust pkgconf chafa
          ffmpeg p7zip jq pandoc perl-image-exiftool imagemagick
          fzf
        # fzf：`smoke_search_both_sources` 里有「装了 fzf 就该标成已安装」这条断言，
        # 容器里必须真装着它 —— 否则那条断言测的是「没装」这件事，必红。

      - name: exiftool 在 vendor_perl 里，把它放进 PATH
        run: echo "/usr/bin/vendor_perl" >> "$GITHUB_PATH"
        # Arch 的 perl-image-exiftool 把可执行文件装到 /usr/bin/vendor_perl/exiftool，
        # 而这个目录只在**登录 shell** 的默认 PATH 里；容器 job 的非交互 shell 没有它，
        # 于是 exif-read 动作会「找不到程序」。产品侧行为是对的（依赖缺失就如实标出来），
        # 缺的是 CI 环境的 PATH。

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-smoke-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 这里会真跑 ffmpeg / 7z / jq / pandoc / exiftool / magick，
      # 并真读本机 pacman 数据库、真联网问 AUR 与 Arch 新闻。
      - name: 冒烟（真跑外部工具 + 真读数据库/联网）
        run: cargo test -- --ignored

      - name: 打包用的 tarball 还能生成
        run: bash packaging/make-source-tarball.sh

  core-no-pacman:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: 无包管理功能编译
        run: cargo build --locked --no-default-features
      - name: 无包管理功能测试
        run: cargo test --locked --no-default-features
