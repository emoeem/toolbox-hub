# 包管理域 = 「进软件包中心」的四个入口 + 三个只有命令行才做得了的查询。
#
# 为什么这里**不再**是十几个包装动作：搜索 / 安装 / 卸载 / 更新 / 清缓存 /
# 孤儿包 / 待更新数 / 官方源信息 / AUR 信息 —— 这些软件包中心里**全都有**，
# 而且中心还能看依赖、能排队、能先摆出要跑的命令、能开演练模式。
# 把它们再包一层，只会让这个域看起来是一张和中心重复的表 ——
# 于是「进域就自动开中心」这种补丁就出现了，层级也就乱了。
#
# 现在和其余六个域一致：**进域 = 动作列表，选中才进视图**；会改系统的动作
# 一律走中心（`i` / `r` / `u` / `c` / `o` 那些键）或命令行
# （`-i` / `-r` / `-u` / `--clear-cache`）。
#
# 会改系统的动作统一标 danger = "caution"，执行时接管终端处理 sudo / Y-n。
# **需要 root 的动作把 program 写成 sudo**：pacman / paccache 自己不会提权，
# 直接跑只会回一句 “unless you are root”。

# ── 界面：四个入口（program 是**界面名[:模式]**，不是命令）──────────────────

[[action]]
id = "pkg-center"
name = "搜索并安装"
summary = "全库浏览 / 搜官方源与 AUR / 排队安装 —— 装包走这条"
domain = "包管理"
tags = ["安装"]
program = "package-center:search"
mode = "native"
# pin 决定域内顺序：四个入口按「最常用」排在最前面
pin = 0
danger = "safe"
install = "自带"
input = "无"
output = "装好的包"
features = "和列表里按 p 是同一个界面；一进去就是全库列表。`/` 进过滤、`1-4` 切面板、`i` 装、`r` 卸"

[[action]]
id = "pkg-center-installed"
name = "已安装 · 卸载"
summary = "看本机装了什么：全部 / 显式 / 依赖 / 外来 / 孤儿，直接排队卸载"
domain = "包管理"
tags = ["卸载"]
program = "package-center:installed"
mode = "native"
pin = 1
danger = "safe"
install = "自带"
input = "无"
output = "卸载后的系统"
features = "五种预过滤；`Enter` 先摆出 `pacman -Rns` 那条命令，再按一次才动手"

[[action]]
id = "pkg-center-news"
name = "Arch 新闻"
summary = "官方新闻源：未读 / 已读，★ 标出「上次升级之后发布的」"
domain = "包管理"
tags = ["维护"]
program = "package-center:news"
mode = "native"
pin = 2
danger = "safe"
install = "自带"
input = "无"
output = "看过的新闻"
features = "`Enter` 抓一次 / 打开链接，`m` 标记已读，`M` 当前列表全标已读"

[[action]]
id = "pkg-center-health"
name = "系统维护"
summary = "一屏看完该处理的事：孤儿 / 依赖完整性 / .pacnew / 缓存 / 更新 / 文件完整性"
domain = "包管理"
tags = ["维护"]
program = "package-center:health"
mode = "native"
pin = 3
danger = "safe"
install = "自带"
input = "无"
output = "处理好的系统"
features = "每项直接 `Enter` 处理；文件完整性要真跑 `pacman -Qk`（几秒），所以单独一项"

# ── 查询：只有命令行能做、中心里没有的 ──────────────────────────────────────
#
# P5-03：下面五条只读查询带 `mcp = { … }` 声明（搜索 / 安装状态 / 包信息 /
# 更新数量 / 维护状态），可以在 mcp.toml 里逐条放行给 AI；mcp.toml 模板的
# allow 名单默认已含这五条。四个 `pkg-center*` 入口是 native 模式（界面里能
# 装能卸），**没有** mcp 声明 —— MCP 只接受 capture，安装/卸载/更新/清理这些
# 改系统的动作不进入暴露面。pkg-owner / pkg-files 不在那五类里，保持不声明。

[[action]]
id = "pkg-search"
name = "用正则搜官方源"
summary = "pacman -Ss：中心是子串匹配，要 `^fzf$` 这种就写这条"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 4
install = "自带（pacman）"
input = "关键词"
output = "匹配的包"
features = "官方源；**支持正则**；标出 [已安装]"
mcp = { enabled = true, description = "用正则搜索官方源软件包（pacman -Ss，只读）" }

[[action.argument]]
key = "query"
label = "关键词"
kind = "text"
flag = "-Ss"
required = true
help = "包名或描述里的词；支持正则，例如 ^fzf$"

[[action]]
id = "pkg-status"
name = "查询安装状态"
summary = "pacman -Q：一个包装没装、装的是哪个版本"
domain = "包管理"
tags = ["查询"]
program = "pacman"
base_argv = ["-Q"]
mode = "capture"
pin = 7
danger = "safe"
install = "自带（pacman）"
input = "包名"
output = "已安装的版本；未安装时 pacman 会在 stderr 说明"
features = "退出码 1 = 没装（这就是查询结果，不算失败）"
ok_exit_codes = [0, 1]
mcp = { enabled = true, description = "查询软件包在本机的安装状态与版本（pacman -Q，只读）" }

[[action.argument]]
key = "package"
label = "包名"
kind = "text"
required = true
help = "精确包名，例如 fzf"

[[action]]
id = "pkg-info"
name = "查询包信息"
summary = "pacman -Si：仓库里这个包的版本、依赖、说明"
domain = "包管理"
tags = ["查询"]
program = "pacman"
base_argv = ["-Si"]
mode = "capture"
pin = 8
danger = "safe"
install = "自带（pacman）"
input = "包名"
output = "包的仓库信息"
features = "读本地同步库，不联网；装没装都能查"
mcp = { enabled = true, description = "查询软件包在仓库中的详细信息（pacman -Si，只读）" }

[[action.argument]]
key = "package"
label = "包名"
kind = "text"
required = true
help = "精确包名，例如 fzf"

[[action]]
id = "pkg-owner"
name = "这个文件属于哪个包"
summary = "pacman -Qo：某个可执行文件 / 配置文件是哪个包装的"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 5
install = "自带（pacman）"
input = "文件路径"
output = "所属包"
features = "查“这个命令哪来的”最快的一条"

[[action.argument]]
key = "file"
label = "文件"
kind = "path"
flag = "-Qo"
required = true
help = "要查的文件路径，例如 /usr/bin/pac"

[[action]]
id = "pkg-files"
name = "这个包装了哪些文件"
summary = "pacman -Ql：列出已安装包的全部文件"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 6
install = "自带（pacman）"
input = "包名"
output = "文件清单"
features = "找文档、找配置文件位置很方便"

[[action.argument]]
key = "package"
label = "包名"
kind = "text"
flag = "-Ql"
required = true
help = "必须是**已安装**的包"

[[action]]
id = "pkg-updates"
name = "待更新数量"
summary = "checkupdates：列出可升级的包（数量就是行数）"
domain = "包管理"
tags = ["维护"]
program = "checkupdates"
mode = "capture"
pin = 9
danger = "safe"
install = "sudo pacman -S pacman-contrib"
input = "无"
output = "包名 当前版本 -> 新版本，每行一个"
features = "在临时副本上比对，不碰系统数据库；没更新时退出码 2，算正常"
ok_exit_codes = [0, 2]
allow_empty = true
mcp = { enabled = true, description = "列出系统待更新的软件包（checkupdates，只读）" }

[[action]]
id = "pkg-health"
name = "依赖完整性巡检"
summary = "pacman -Qk：全库检查有没有包缺依赖"
domain = "包管理"
tags = ["维护"]
program = "pacman"
base_argv = ["-Qk"]
mode = "capture"
pin = 10
danger = "safe"
install = "自带（pacman）"
input = "无"
output = "缺依赖的包与问题数"
features = "退出码 1 = 发现问题（巡检结果，不算失败）；系统维护视图里的同一项检查"
ok_exit_codes = [0, 1]
allow_empty = true
mcp = { enabled = true, description = "读取系统维护状态：全库依赖完整性巡检（pacman -Qk，只读）" }
