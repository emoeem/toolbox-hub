# 包管理域 = 「进软件包中心」的四个入口 + 三个只有命令行才做得了的查询。
#
# 为什么这里**不再**是十几个包装动作：搜索 / 安装 / 卸载 / 更新 / 清缓存 /
# 孤儿包 / 待更新数 / 官方源信息 / AUR 信息 —— 这些软件包中心里**全都有**，
# 而且中心还能看依赖、能排队、能先摆出要跑的命令、能开演练模式。
# 把它们再包一层，只会让这个域看起来是一张和中心重复的表 ——
# 于是「进域就自动开中心」这种补丁就出现了，层级也就乱了。
#
# 现在和其余六个域一致：**进域 = 动作列表，选中才进视图**；会改系统的动作
# 一律走中心（`i` / `r` / `u` / `c` / `o` 那些键）或命令行
# （`-i` / `-r` / `-u` / `--clear-cache`）。
#
# 会改系统的动作统一标 danger = "caution"，执行时接管终端处理 sudo / Y-n。
# **需要 root 的动作把 program 写成 sudo**：pacman / paccache 自己不会提权，
# 直接跑只会回一句 “unless you are root”。

# ── 界面：四个入口（program 是**界面名[:模式]**，不是命令）──────────────────

[[action]]
id = "pkg-center"
name = "搜索并安装"
summary = "全库浏览 / 搜官方源与 AUR / 排队安装 —— 装包走这条"
domain = "包管理"
tags = ["安装"]
program = "package-center:search"
mode = "native"
# pin 决定域内顺序：四个入口按「最常用」排在最前面
pin = 0
danger = "safe"
install = "自带"
input = "无"
output = "装好的包"
features = "和列表里按 p 是同一个界面；一进去就是全库列表。`/` 进过滤、`1-4` 切面板、`i` 装、`r` 卸"

[[action]]
id = "pkg-center-installed"
name = "已安装 · 卸载"
summary = "看本机装了什么：全部 / 显式 / 依赖 / 外来 / 孤儿，直接排队卸载"
domain = "包管理"
tags = ["卸载"]
program = "package-center:installed"
mode = "native"
pin = 1
danger = "safe"
install = "自带"
input = "无"
output = "卸载后的系统"
features = "五种预过滤；`Enter` 先摆出 `pacman -Rns` 那条命令，再按一次才动手"

[[action]]
id = "pkg-center-news"
name = "Arch 新闻"
summary = "官方新闻源：未读 / 已读，★ 标出「上次升级之后发布的」"
domain = "包管理"
tags = ["维护"]
program = "package-center:news"
mode = "native"
pin = 2
danger = "safe"
install = "自带"
input = "无"
output = "看过的新闻"
features = "`Enter` 抓一次 / 打开链接，`m` 标记已读，`M` 当前列表全标已读"

[[action]]
id = "pkg-center-health"
name = "系统维护"
summary = "一屏看完该处理的事：孤儿 / 依赖完整性 / .pacnew / 缓存 / 更新 / 文件完整性"
domain = "包管理"
tags = ["维护"]
program = "package-center:health"
mode = "native"
pin = 3
danger = "safe"
install = "自带"
input = "无"
output = "处理好的系统"
features = "每项直接 `Enter` 处理；文件完整性要真跑 `pacman -Qk`（几秒），所以单独一项"

# ── 查询：只有命令行能做、中心里没有的 ──────────────────────────────────────

[[action]]
id = "pkg-search"
name = "用正则搜官方源"
summary = "pacman -Ss：中心是子串匹配，要 `^fzf$` 这种就写这条"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 4
install = "自带（pacman）"
input = "关键词"
output = "匹配的包"
features = "官方源；**支持正则**；标出 [已安装]"

[[action.argument]]
key = "query"
label = "关键词"
kind = "text"
flag = "-Ss"
required = true
help = "包名或描述里的词；支持正则，例如 ^fzf$"

[[action]]
id = "pkg-owner"
name = "这个文件属于哪个包"
summary = "pacman -Qo：某个可执行文件 / 配置文件是哪个包装的"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 5
install = "自带（pacman）"
input = "文件路径"
output = "所属包"
features = "查“这个命令哪来的”最快的一条"

[[action.argument]]
key = "file"
label = "文件"
kind = "path"
flag = "-Qo"
required = true
help = "要查的文件路径，例如 /usr/bin/pac"

[[action]]
id = "pkg-files"
name = "这个包装了哪些文件"
summary = "pacman -Ql：列出已安装包的全部文件"
domain = "包管理"
tags = ["查询"]
program = "pacman"
mode = "capture"
pin = 6
install = "自带（pacman）"
input = "包名"
output = "文件清单"
features = "找文档、找配置文件位置很方便"

[[action.argument]]
key = "package"
label = "包名"
kind = "text"
flag = "-Ql"
required = true
help = "必须是**已安装**的包"
