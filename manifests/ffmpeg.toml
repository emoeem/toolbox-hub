default = "false"
help = "关着的话，输出已存在时 ffmpeg 会自己问你"

[[action.argument]]
key = "output"
label = "输出文件"
kind = "path"
required = true
default = "{stem}.gif"
help = "支持 {stem}/{name}/{ext}/{dir} 模板 —— 批量时每个输入各生成一个"

