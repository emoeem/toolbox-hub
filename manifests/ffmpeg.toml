flag = "-c:v"
default = "copy"
help = "copy = 画面原样拷贝，不重编码"
choices = [
  { label = "直接拷贝（快）", value = "copy" },
]

[[action.argument]]
key = "overwrite"
label = "覆盖已有文件"
kind = "toggle"
flag = "-y"
default = "false"
help = "关着的话，输出已存在时 ffmpeg 会自己问你"

[[action.argument]]
key = "output"
label = "输出文件"
kind = "path"
required = true
default = "{stem}_mute.mp4"
help = "支持 {stem}/{name}/{ext}/{dir} 模板 —— 批量时每个输入各生成一个"

[[action]]
id = "ffmpeg-merge-av"
name = "合并画面与声音"
summary = "把一个视频和一个音频合成一个文件（例如给无声视频配乐）"
domain = "媒体"
tags = ["编辑"]
program = "ffmpeg"
# 把进度吐到 stdout（结构化 key=value），工具箱解析它画实时进度；
# -nostats 关掉 stderr 上那堆 \r 刷屏的统计行。
base_argv = ["-nostats", "-progress", "pipe:1"]
mode = "capture"
# 进度条的总时长从哪儿来：探这个参数的媒体文件。
duration_from = "video"
install = "sudo pacman -S ffmpeg"
input = "一个视频 + 一个音频"
output = "合起来的文件"
features = "流直接拷贝；可指定取哪条流"

[[action.argument]]
key = "video"
label = "视频（画面）"
kind = "path"
flag = "-i"
required = true
help = "取它的画面"

[[action.argument]]
key = "audio"
label = "音频（声音）"
kind = "path"
flag = "-i"
required = true
help = "取它的声音"

[[action.argument]]
key = "map_video"
label = "取哪条画面流"
kind = "text"
flag = "-map"
default = "0:v:0"
help = "0 表示第一个输入（视频）；0:v:0 = 它的第一条视频流"

[[action.argument]]
key = "map_audio"
label = "取哪条音频流"
kind = "text"
flag = "-map"
default = "1:a:0"
help = "1 表示第二个输入（音频）；1:a:0 = 它的第一条音频流"

[[action.argument]]
key = "codec"
label = "编码方式"
kind = "choice"
flag = "-c"
required = true
default = "copy"
help = "拷贝不重编码，最快也无损"
choices = [
  { label = "直接拷贝（无损）", value = "copy" },
]

[[action.argument]]
key = "overwrite"
label = "覆盖已有文件"
kind = "toggle"
flag = "-y"
default = "false"
help = "关着的话，输出已存在时 ffmpeg 会自己问你"

[[action.argument]]
key = "output"
label = "输出文件"
kind = "path"
required = true
help = "例如 /tmp/merged.mp4"
