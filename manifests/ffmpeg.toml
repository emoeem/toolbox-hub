label = "丢掉画面"
kind = "toggle"
flag = "-vn"
default = "true"
help = "提取音频就应该是开着的"

[[action.argument]]
key = "overwrite"
label = "覆盖已有文件"
kind = "toggle"
flag = "-y"
default = "false"
help = "关着的话，输出已存在时 ffmpeg 会自己问你"

[[action.argument]]
key = "output"
label = "输出文件"
kind = "path"
required = true
default = "{stem}.mp3"
help = "支持 {stem}/{name}/{ext}/{dir} 模板 —— 批量时每个输入各生成一个"

# ── 其它常用动作 ────────────────────────────────────────────────────────────

