# -nostats 关掉 stderr 上那堆 \r 刷屏的统计行。
base_argv = ["-nostats", "-progress", "pipe:1"]
mode = "capture"
# 批量：每个输入各跑一次、各自一个输出。
foreach = "input"
# 进度条的总时长从哪儿来：探这个参数的媒体文件。
duration_from = "input"
install = "sudo pacman -S ffmpeg"
input = "视频文件"
output = "缩放后的视频"
features = "按宽度等比；音频可原样拷贝"

[[action.argument]]
key = "input"
label = "输入视频"
kind = "path"
flag = "-i"
required = true
repeatable = true
placement = "leading"
help = "要缩放的视频"

[[action.argument]]
key = "scale"
label = "目标分辨率"
kind = "choice"
flag = "-vf"
required = true
default = "scale=-2:720"
help = "按宽度等比缩放，高度取偶数"
choices = [
  { label = "1080p", value = "scale=-2:1080" },
  { label = "720p", value = "scale=-2:720" },
  { label = "480p", value = "scale=-2:480" },
  { label = "360p", value = "scale=-2:360" },
]

[[action.argument]]
key = "crf"
label = "画质（CRF）"
kind = "choice"
flag = "-crf"
default = "20"
help = "重编码才有画质档；20 比默认 23 更清晰"
choices = [
  { label = "清晰（18）", value = "18" },
  { label = "较好（20）", value = "20" },
  { label = "默认（23）", value = "23" },
]

[[action.argument]]
key = "audio_codec"
label = "音频"
kind = "text"
flag = "-c:a"
default = "copy"
help = "copy = 音频原样拷贝，不重新编码"

[[action.argument]]
key = "video_codec"
label = "视频编码"
kind = "text"
flag = "-c:v"
default = "libx264"
help = "libx264 通用"

[[action.argument]]
key = "overwrite"
label = "覆盖已有文件"
kind = "toggle"
flag = "-y"
default = "false"
help = "关着的话，输出已存在时 ffmpeg 会自己问你"

[[action.argument]]
key = "output"
label = "输出文件"
kind = "path"
required = true
default = "{stem}_resized.mp4"
help = "支持 {stem}/{name}/{ext}/{dir} 模板 —— 批量时每个输入各生成一个"

[[action]]
id = "ffmpeg-extract-audio"
name = "提取音频"
summary = "把视频里的声音单独存成一个音频文件"
domain = "媒体"
tags = ["转码"]
program = "ffmpeg"
# 把进度吐到 stdout（结构化 key=value），工具箱解析它画实时进度；
# -nostats 关掉 stderr 上那堆 \r 刷屏的统计行。
base_argv = ["-nostats", "-progress", "pipe:1"]
mode = "capture"
# 批量：每个输入各跑一次、各自一个输出。
foreach = "input"
# 进度条的总时长从哪儿来：探这个参数的媒体文件。
duration_from = "input"
install = "sudo pacman -S ffmpeg"
input = "视频文件"
output = "音频文件"
features = "MP3 / AAC / FLAC；可选码率；丢掉画面"

[[action.argument]]
key = "input"
label = "输入文件"
kind = "path"
flag = "-i"
required = true
repeatable = true
placement = "leading"
help = "必须有音轨，否则 ffmpeg 会报「Output file does not contain any stream」"

[[action.argument]]
key = "audio_codec"
label = "音频格式"
kind = "choice"
