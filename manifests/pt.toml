# 渗透测试域：常用侦察与扫描动作（单程序封装，参数经 Schema 校验）。
#
# 安全口径：
# - 所有动作都会主动访问目标网络，effects 均含 network_access，经 MCP 调用时
#   需要客户端支持确认（elicitation），由使用者在每次调用前确认目标与范围。
# - 重扫描类（端口 / 服务 / 漏洞 / 目录爆破）danger = caution：TUI 里多一次确认。
# - 仅对**已授权**的目标使用；engagement 范围以外一律不要运行。
# - 目标一律必填、不设默认公网地址；爬取 / 爆破类给了保守默认值（速率、深度、
#   超时），nuclei 默认排除 dos 模板 —— 要放开就去改参数，别改默认。
#
# 许可证口径：这里只做**外部命令封装**（capture 原样展示输出，不做结构化解析），
# 不打包任何上游源码或二进制 —— Nmap（NPSL）、RustScan / AutoRecon（GPL-3.0）等
# 许可证各异，一律依赖用户自行安装的上游程序。
#
# 下面 mcp 声明同样只是「作者声明」，真正暴露还要 ~/.config/toolbox-hub/mcp.toml 放行。

[[action]]
id = "subdomain-enum"
name = "子域枚举（被动）"
summary = "subfinder 被动收集目标域的子域"
domain = "网络"
tags = ["渗透", "侦察", "子域"]
program = "subfinder"
base_argv = ["-d"]
mode = "capture"
danger = "safe"
install = "go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
input = "目标主域"
output = "子域列表（每行一个）"
mcp = { enabled = true, name = "pt_subdomain_enum", description = "subfinder 被动枚举目标域的子域（仅 DNS 数据源，不主动探测）", effects = { network_access = true } }

[[action.argument]]
key = "domain"
label = "目标主域（example.com）"
kind = "text"
required = true
help = "只填主域，不带协议与路径"

[[action]]
id = "dns-records"
name = "DNS 记录查询"
summary = "查询域名的 A / AAAA / MX / NS / TXT / CNAME 记录"
domain = "网络"
tags = ["渗透", "侦察", "dns"]
program = "dig"
mode = "capture"
danger = "safe"
install = "自带（bind）"
input = "域名 + 记录类型"
output = "DNS 应答记录"
mcp = { enabled = true, name = "pt_dns_records", description = "dig 查询域名 DNS 记录（类型可选）", effects = { network_access = true } }

[[action.argument]]
key = "domain"
label = "域名"
kind = "text"
required = true
help = "只填域名本身，不带协议与路径"

[[action.argument]]
key = "rtype"
label = "记录类型"
kind = "choice"
choices = [
      { label = "A（IPv4）", value = "A" },
      { label = "AAAA（IPv6）", value = "AAAA" },
      { label = "MX（邮件）", value = "MX" },
      { label = "NS（域名服务器）", value = "NS" },
      { label = "TXT（文本）", value = "TXT" },
      { label = "CNAME", value = "CNAME" },
      { label = "SOA", value = "SOA" },
      { label = "ANY（全部）", value = "ANY" },
    ]
default = "A"
help = "ANY 让 dig 把各类记录都问一遍，其余按类型单查"

[[action]]
id = "http-probe"
name = "HTTP 探活"
summary = "httpx 探测目标 Web 服务：状态码、标题、技术栈、CDN"
domain = "网络"
tags = ["渗透", "探测", "httpx"]
program = "httpx"
base_argv = ["-silent", "-title", "-tech-detect", "-status-code", "-cdn", "-web-server"]
mode = "capture"
danger = "safe"
install = "go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest"
input = "URL 或主机"
output = "探活结果表"
mcp = { enabled = true, name = "pt_http_probe", description = "httpx 探测目标 Web 服务（状态码/标题/技术栈/CDN）", effects = { network_access = true } }

[[action.argument]]
key = "target"
label = "目标（host 或 URL）"
kind = "text"
flag = "-u"
required = true
help = "单个目标；批量请走 TUI 传文件"

[[action]]
id = "port-scan-top"
name = "端口扫描（Top 1000）"
summary = "naabu 快速扫描常见 1000 端口"
domain = "网络"
tags = ["渗透", "端口", "naabu"]
program = "naabu"
base_argv = ["-top-ports", "1000", "-silent"]
mode = "capture"
danger = "caution"
install = "go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest"
input = "主机（IP 或域名）"
output = "开放端口列表"
mcp = { enabled = true, name = "pt_port_scan_top", description = "naabu 扫描目标常见 1000 个端口（需确认）", effects = { network_access = true } }

[[action.argument]]
key = "host"
label = "目标主机"
kind = "text"
flag = "-host"
required = true
help = "IP 或域名；只对已授权的目标使用"

[[action]]
id = "service-scan"
name = "服务识别（nmap）"
summary = "nmap 对最常见 100 端口做服务与版本识别"
domain = "网络"
tags = ["渗透", "端口", "nmap"]
program = "nmap"
base_argv = ["-sV", "--top-ports", "100", "--open"]
mode = "capture"
danger = "caution"
install = "sudo pacman -S nmap"
input = "主机（IP 或域名）"
output = "端口 / 服务 / 版本"
mcp = { enabled = true, name = "pt_service_scan", description = "nmap 服务与版本识别（top 100 端口，需确认）", effects = { network_access = true } }

[[action.argument]]
key = "host"
label = "目标主机"
kind = "text"
required = true
help = "IP 或域名；逐个探服务比纯端口扫描慢，属正常现象"

# -etags dos：社区模板里的 DoS / 压测类默认不跑，真要打先在 TUI 里明说。
[[action]]
id = "nuclei-scan"
name = "漏洞模板扫描（nuclei）"
summary = "nuclei 按严重度过滤跑模板扫描"
domain = "网络"
tags = ["渗透", "漏洞", "nuclei"]
program = "nuclei"
base_argv = ["-silent", "-nc", "-etags", "dos"]
mode = "capture"
danger = "caution"
install = "go install -v github.com/projectdiscovery/nuclei/v2/cmd/nuclei@latest"
input = "URL + 严重度过滤"
output = "命中的漏洞发现"
mcp = { enabled = true, name = "pt_nuclei_scan", description = "nuclei 模板漏洞扫描（按严重度过滤，需确认）", effects = { network_access = true } }

[[action.argument]]
key = "target"
label = "目标 URL"
kind = "text"
flag = "-u"
required = true
help = "例如 https://example.com"

[[action.argument]]
key = "severity"
label = "严重度过滤"
kind = "choice"
choices = [
      { label = "仅 critical", value = "critical" },
      { label = "critical + high", value = "critical,high" },
      { label = "medium 及以上（默认）", value = "medium,high,critical" },
      { label = "全部（含 low/info）", value = "low,medium,high,critical" },
    ]
flag = "-severity"
default = "medium,high,critical"
help = "默认从 medium 起步压掉噪音；要连 low/info 一起看选最后一项"

[[action]]
id = "dir-fuzz"
name = "目录发现（feroxbuster）"
summary = "feroxbuster 递归目录与文件爆破（深度可调）"
domain = "网络"
tags = ["渗透", "目录", "feroxbuster"]
program = "feroxbuster"
base_argv = ["-s", "200,204,301,302,307,401,403"]
mode = "capture"
danger = "caution"
install = "cargo install feroxbuster 或 pacman -S feroxbuster"
input = "基础 URL + 深度"
output = "发现的路径"
mcp = { enabled = true, name = "pt_dir_fuzz", description = "feroxbuster 目录发现（需确认；仅对授权目标使用）", effects = { network_access = true } }

[[action.argument]]
key = "url"
label = "基础 URL"
kind = "text"
flag = "-u"
required = true
help = "例如 https://example.com"

[[action.argument]]
key = "depth"
label = "递归深度"
kind = "text"
default = "2"
help = "每深一层请求量翻几倍，2 层起步比较稳妥"

[[action]]
id = "tech-fingerprint"
name = "Web 指纹识别"
summary = "whatweb 识别目标的技术栈与框架"
domain = "网络"
tags = ["渗透", "指纹", "whatweb"]
program = "whatweb"
base_argv = ["-a", "3", "--color=never"]
mode = "capture"
danger = "safe"
install = "sudo pacman -S whatweb 或 gem install whatweb"
input = "URL 或主机"
output = "技术栈指纹"
mcp = { enabled = true, name = "pt_tech_fingerprint", description = "whatweb 识别目标技术栈与框架", effects = { network_access = true } }

[[action.argument]]
key = "target"
label = "目标（host 或 URL）"
kind = "text"
required = true
help = "带 scheme 的 URL 更准（whatweb 能据此判断端口）"

[[action]]
id = "waf-detect"
name = "WAF 检测"
summary = "wafw00f 探测目标前置的 WAF 产品"
domain = "网络"
tags = ["渗透", "waf"]
program = "wafw00f"
mode = "capture"
danger = "safe"
install = "pip install wafw00f"
input = "URL"
output = "WAF 识别结果"
mcp = { enabled = true, name = "pt_waf_detect", description = "wafw00f 探测目标是否存在 WAF", effects = { network_access = true } }

[[action.argument]]
key = "target"
label = "目标 URL"
kind = "text"
required = true
help = "例如 https://example.com"

[[action]]
id = "tls-audit"
name = "TLS 配置检测（testssl.sh）"
summary = "testssl.sh 检查目标的证书与 TLS 配置：协议、密码套件、已知漏洞项"
domain = "网络"
tags = ["渗透", "tls", "证书"]
program = "testssl.sh"
base_argv = ["--quiet", "--warnings", "batch", "--color", "0"]
mode = "capture"
danger = "safe"
install = "sudo pacman -S testssl.sh"
input = "目标（host:port 或 URL）"
output = "TLS 配置与证书检测结果"
mcp = { enabled = true, name = "pt_tls_audit", description = "testssl.sh 检测目标 TLS/证书配置（协议、密码套件、已知漏洞项）", effects = { network_access = true } }

[[action.argument]]
key = "target"
label = "目标（host:port 或 URL）"
kind = "text"
required = true
help = "例如 example.com:443 或 https://example.com"

[[action]]
id = "web-crawl"
name = "Web 爬取（katana）"
summary = "katana 爬取目标页面与 JS 里的链接、接口和路径"
domain = "网络"
tags = ["渗透", "爬虫", "katana"]
program = "katana"
base_argv = ["-silent"]
mode = "capture"
danger = "caution"
install = "go install -v github.com/projectdiscovery/katana/cmd/katana@latest"
input = "目标 URL + 深度"
output = "发现的链接与路径（每行一个）"
mcp = { enabled = true, name = "pt_web_crawl", description = "katana 爬取目标页面与 JS 中的链接、接口和路径（需确认）", effects = { network_access = true } }

[[action.argument]]
key = "url"
label = "目标 URL"
kind = "text"
flag = "-u"
required = true
help = "例如 https://example.com"

[[action.argument]]
key = "depth"
label = "最大爬取深度"
kind = "text"
flag = "-d"
default = "2"
help = "katana 自身默认 3 层；这里保守从 2 层起步，要更深自己在表单里改"

[[action.argument]]
key = "rate"
label = "每秒最多请求数"
kind = "text"
flag = "-rl"
default = "100"
help = "0 = 不限速；默认限到 100，宁慢勿炸"

[[action]]
id = "param-fuzz"
name = "内容模糊测试（ffuf）"
summary = "ffuf 对 URL 里的 FUZZ 位置做字典模糊测试（目录、参数、Header）"
domain = "网络"
tags = ["渗透", "目录", "fuzz"]
program = "ffuf"
base_argv = ["-s", "-mc", "200,204,301,302,307,401,403", "-t", "20", "-timeout", "10"]
mode = "capture"
danger = "caution"
install = "sudo pacman -S ffuf 或 go install -v github.com/ffuf/ffuf/v2@latest"
input = "URL（含 FUZZ 占位）+ 字典文件"
output = "命中条目（状态码 + 内容）"
mcp = { enabled = true, name = "pt_param_fuzz", description = "ffuf 字典模糊测试（需确认；仅对授权目标使用）", effects = { network_access = true } }

[[action.argument]]
key = "url"
label = "目标 URL（注入点写 FUZZ）"
kind = "text"
flag = "-u"
required = true
help = "把要模糊测的位置写成 FUZZ，例如 https://example.com/FUZZ 或 https://example.com/?q=FUZZ"

[[action.argument]]
key = "wordlist"
label = "字典文件"
kind = "path"
flag = "-w"
required = true
help = "例如 /usr/share/seclists/Discovery/Web-Content/common.txt"

[[action.argument]]
key = "rate"
label = "每秒最多请求数"
kind = "text"
flag = "-rate"
default = "100"
help = "0 = 不限速；默认限到 100"

# rustscan 只管「哪些端口开着」，服务识别交给 service-scan（nmap）那条。
[[action]]
id = "fast-port-scan"
name = "端口扫描（RustScan 全端口）"
summary = "rustscan 用异步批量连接快速扫端口，只报开放端口"
domain = "网络"
tags = ["渗透", "端口", "rustscan"]
program = "rustscan"
mode = "capture"
danger = "caution"
install = "sudo pacman -S rustscan 或 cargo install rustscan"
input = "主机 + 端口范围"
output = "开放端口列表"
mcp = { enabled = true, name = "pt_fast_port_scan", description = "rustscan 快速端口扫描（默认全端口，需确认）", effects = { network_access = true } }

[[action.argument]]
key = "host"
label = "目标主机"
kind = "text"
flag = "-a"
required = true
help = "IP 或域名；只对已授权的目标使用"

[[action.argument]]
key = "ports"
label = "端口范围"
kind = "text"
flag = "-p"
default = "1-65535"
help = "全端口是 rustscan 的本来面目；也可填列表（80,443）或小范围（1-1024）"

# AutoRecon 单次常跑 30 分钟以上：MCP 那边有 300 秒超时上限，多半跑不完就被掐，
# 这条主要是给 TUI 用的；它会往结果目录写文件，effects 里如实声明。
[[action]]
id = "auto-recon"
name = "自动化侦察（AutoRecon）"
summary = "autorecon 串联端口扫描与服务枚举插件，自动整理侦察结果"
domain = "网络"
tags = ["渗透", "侦察", "autorecon"]
program = "autorecon"
mode = "capture"
danger = "caution"
install = "pipx install autorecon 或 pip install --user autorecon"
input = "目标 + 结果目录"
output = "结果目录里的扫描报告（stdout 是进度与命令记录）"
mcp = { enabled = true, name = "pt_auto_recon", description = "AutoRecon 自动化侦察（写结果目录；单次常超 30 分钟，MCP 300 秒上限会中断，建议 TUI 使用）", effects = { network_access = true, filesystem_write = true } }

[[action.argument]]
key = "target"
label = "目标（IP / 段 / 主机名）"
kind = "text"
flag = "-t"
required = true
help = "支持逗号分隔多目标与 CIDR 段；只对已授权的目标使用"

[[action.argument]]
key = "output_dir"
label = "结果目录"
kind = "path"
flag = "-o"
default = "results"
help = "相对当前工作目录；AutoRecon 会在这里写扫描报告"
