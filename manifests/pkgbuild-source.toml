# 「打包」域：给你自己的 Arch 软件包仓库（pkgbuild-source）用。
#
# 二十个动作都经 `tbx-pkgbuild` 转给那个仓库的 `manage.sh <代号>`：
#
#   · `tbx-pkgbuild` 是个几行的转发脚本，只干一件事 —— **找仓库**：
#     $TOOLBOX_HUB_PKGBUILD_SRC > ~/pkgbuild-source > ~/code/pkgbuild-source。
#     仓库在哪儿只有你知道，所以没法写死在随包发布的 manifest 里。
#   · 源码用户：./scripts/pkgbuild-source/install.sh（装到 ~/.local/bin）
#   · 装包用户：PKGBUILD 已经把它放进 /usr/bin
#
# 没装那个仓库时，这些动作会显示「依赖缺失」并给出上面那条安装办法 ——
# 不装也不影响别的域，这个域本来就是可选的。
#
# mode 是**实测**分出来的：只读的走 capture（输出留在工具箱的输出视图里），
# 要 fzf 选包 / sudo 提权的走 interactive（把终端交给它）。
# 想加动作：先看 `tbx-pkgbuild --list`，再照抄一条。

# ── 只读：留在工具箱里看 ───────────────────────────────────────────────────

[[action]]
id = "pkgsrc-dashboard"
name = "软件仓库 · 状态总览"
summary = "分支 / 工作区 / 包数 / 最近 Actions / 时序与修复记录条数"
domain = "打包"
tags = ["仓库"]
program = "tbx-pkgbuild"
base_argv = ["dashboard"]
mode = "capture"
pin = 0
danger = "safe"
install = "./scripts/pkgbuild-source/install.sh（仓库默认找 ~/pkgbuild-source）"
input = "无"
output = "一屏状态"
features = "只读，不会动仓库"

[[action]]
id = "pkgsrc-doctor"
name = "软件仓库 · 环境自检"
summary = "Git / 包元数据 / CI 配置 / ShellCheck / gh / podman / ccache / 磁盘 / 网络"
domain = "打包"
tags = ["诊断"]
program = "tbx-pkgbuild"
base_argv = ["doctor"]
mode = "capture"
pin = 1
danger = "safe"
install = "./scripts/pkgbuild-source/install.sh（仓库默认找 ~/pkgbuild-source）"
input = "无"
output = "体检报告 + READY 结论"
features = "只读；有警告也退 0，结论看最后一行"

[[action]]
id = "pkgsrc-audit"
name = "软件仓库 · 审计全部软件包"
summary = "把 13 个包全过一遍：namcap / ShellCheck / PKGBUILD 规范"
domain = "打包"
tags = ["诊断"]
program = "tbx-pkgbuild"
base_argv = ["audit"]
mode = "capture"
pin = 2
danger = "safe"
install = "./scripts/pkgbuild-source/install.sh（仓库默认找 ~/pkgbuild-source）"
input = "无"
output = "逐包审计结论"
features = "只读，但包多时要跑一会儿"

[[action]]
id = "pkgsrc-timing"
name = "软件仓库 · 构建时序统计"
summary = "download / prepare / build / package 各阶段耗时与 ccache 命中率"
domain = "打包"
tags = ["构建"]
program = "tbx-pkgbuild"
base_argv = ["timing"]
mode = "capture"
pin = 3
danger = "safe"
install = "./scripts/pkgbuild-source/install.sh（仓库默认找 ~/pkgbuild-source）"
input = "无"
output = "阶段耗时汇总"
features = "读 state/timing-history.jsonl；没有记录就直说"

[[action]]
id = "pkgsrc-pull"
name = "软件仓库 · 拉取 main"
summary = "git pull --ff-only：把远端 main 合到本地（工作区脏就拒绝，不覆盖你的改动）"
domain = "打包"
tags = ["仓库"]
program = "tbx-pkgbuild"
base_argv = ["pull"]
mode = "capture"
pin = 4
danger = "caution"
install = "./scripts/pkgbuild-source/install.sh（仓库默认找 ~/pkgbuild-source）"
input = "无"
output = "更新后的工作区"
features = "工作区有未提交修改时它会**拒绝**并退 1，不会硬覆盖"

# ── 要用 fzf 选包 / sudo 提权：把终端交给它 ────────────────────────────────

[[action]]
id = "pkgsrc-add-aur"
name = "软件仓库 · 添加 AUR 软件包"
