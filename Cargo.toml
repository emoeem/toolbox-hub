[package]
name = "toolbox-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
# libalpm 直连：搜索 / 包信息 / 已安装 / 可更新数都走它，不再解析 pacman 的文本输出。
# 代价是二进制依赖 libalpm.so（Arch 上本来就有），换来的是结构化数据与数量级的提速。
alpm = "5"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
